[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sql-to-dax"
version = "0.1.0"
description = "Translate a documented subset of Databricks SparkSQL analytical queries into DAX."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Gareth" }]
keywords = ["dax", "sql", "databricks", "sparksql", "powerbi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
]
dependencies = ["sqlglot>=25.0"]

[project.optional-dependencies]
dev = ["build>=1.2", "mypy>=1.10", "pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
sql-to-dax = "sql_to_dax.cli:main"

[project.urls]
Homepage = "https://github.com/heimdallur/sql-to-dax"
Repository = "https://github.com/heimdallur/sql-to-dax"
Issues = "https://github.com/heimdallur/sql-to-dax/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/sql_to_dax"]

[tool.hatch.build.targets.wheel.force-include]
"src/sql_to_dax/py.typed" = "sql_to_dax/py.typed"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
